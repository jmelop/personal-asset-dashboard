version: "3.9"

services:
  db:
    image: postgres:16
    container_name: personal-asset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetuser
      POSTGRES_PASSWORD: assetpass
      POSTGRES_DB: assetdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data: